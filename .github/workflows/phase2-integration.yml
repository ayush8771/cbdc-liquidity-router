name: phase2-integration

# Arch §5.4. This first version runs the contract-conformance job only. Lock-drift
# checks, npm ci and the Compose full profile with e2e/ are added as those
# folders land.
on:
  push:
    branches: [main]
    paths:
      - "contracts/**"
      - "infra/**"
      - "e2e/**"
      - ".nvmrc"
      - ".github/workflows/phase2-integration.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "infra/**"
      - "e2e/**"
      - ".nvmrc"
      - ".github/workflows/phase2-integration.yml"

permissions:
  contents: read

concurrency:
  group: phase2-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contract conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          cache: pip
          cache-dependency-path: infra/scripts/requirements.txt

      - name: Install tooling
        run: |
          python -m pip install -r infra/scripts/requirements.txt
          python -m pip check

      - name: Validate OpenAPI documents and fixtures
        run: python infra/scripts/check_contracts.py

      - name: Test the checker
        run: python -m pytest infra/scripts/tests -q -p no:cacheprovider
