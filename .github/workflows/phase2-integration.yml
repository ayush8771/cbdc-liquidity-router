name: phase2-integration

# Arch §5.4. This first version runs the contract-conformance job only. Lock-drift
# checks, npm ci and the Compose full profile with e2e/ are added as those
# folders land.
on:
  push:
    branches: [main, feature/phase2-platform]
    paths:
      - "contracts/**"
      - "infra/**"
      - "e2e/**"
      - "services/backend/**"
      - ".nvmrc"
      - ".github/workflows/phase2-integration.yml"
  pull_request:
    paths:
      - "contracts/**"
      - "infra/**"
      - "e2e/**"
      - "services/backend/**"
      - ".nvmrc"
      - ".github/workflows/phase2-integration.yml"

permissions:
  contents: read

concurrency:
  group: phase2-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contract conformance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: since October 2026 ubuntu-latest is
        # Ubuntu 26.04, which has no Python 3.10.11 build for setup-python.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.11"
          cache: pip
          cache-dependency-path: infra/scripts/requirements.txt

      - name: Install tooling
        run: |
          python -m pip install -r infra/scripts/requirements.txt
          python -m pip check

      - name: Validate OpenAPI documents and fixtures
        run: python infra/scripts/check_contracts.py

      - name: Test the checker
        run: python -m pytest infra/scripts/tests -q -p no:cacheprovider

  # The backend unit tests plus the four PostgreSQL integration suites (services/backend/README.md §7).
  # The suites are skipped as a whole, with a green exit code, whenever CBDC_TEST_DATABASE_URL is unset, and
  # Node's "# skipped" counter does not count skipped suites. The last step therefore reads the TAP output and
  # fails unless each suite is reported as a plain "ok N - <title>" line.
  # No GitHub secret is used. The database is an isolated service container on the runner, published on
  # loopback only (checked below), and it holds only the suites' throwaway test data, so it needs no password.
  backend-postgres:
    name: backend PostgreSQL integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: services/backend
    services:
      postgres:
        image: postgres:18.6-bookworm@sha256:f1ea2a1a4fb7b68d4836be1fdcb8a6466a89b072158bf9d97663600538c294c5 # the digest in infra/compose.yaml
        env:
          POSTGRES_USER: cbdc_ci
          POSTGRES_DB: cbdc_router_test # the suites refuse any database whose name does not end in _test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - "127.0.0.1:5432:5432"
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U cbdc_ci -d cbdc_router_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://cbdc_ci@127.0.0.1:5432/cbdc_router_test
      CBDC_TEST_DATABASE_URL: postgresql://cbdc_ci@127.0.0.1:5432/cbdc_router_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: The database must be published on loopback only
        run: |
          set -euo pipefail
          ports="$(docker ps --filter publish=5432 --format '{{.Ports}}')"
          echo "published: $ports"
          grep -Fq '127.0.0.1:5432->5432/tcp' <<< "$ports" || { echo "::error::PostgreSQL is not published on 127.0.0.1:5432"; exit 1; }
          if grep -Eq '(^|[ ,])(0\.0\.0\.0|\[?::\]?):5432' <<< "$ports"; then echo "::error::PostgreSQL is published on a non-loopback address"; exit 1; fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: services/backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply the migrations
        run: npx prisma migrate deploy

      - name: Backend tests (unit and PostgreSQL integration)
        run: |
          set -euo pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/backend-test.log"

      - name: All four PostgreSQL integration suites must have run
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/backend-test.log"
          bad=0
          fail() { echo "::error::$*"; bad=1; }
          suites=(
            "GET /api/v1/transactions (PostgreSQL integration)"
            "POST /api/v1/transactions (PostgreSQL integration)"
            "GET /api/v1/dashboard/summary (PostgreSQL integration)"
            "comparisons (PostgreSQL integration)"
          )
          # A top-level suite line is "ok N - <title>" exactly; a skipped suite has " # SKIP <reason>" appended.
          ran="$(sed -n -E 's/^ok [0-9]+ - //p' "$log")"
          for s in "${suites[@]}"; do
            grep -Fxq -- "$s" <<< "$ran" || fail "suite did not run to completion (missing, skipped, renamed or failed): $s"
          done
          grep -q 'CBDC_TEST_DATABASE_URL is not set' "$log" && fail "the database URL was not set"
          grep -Eq '^\s*(not ok|ok .*# (SKIP|TODO))' "$log" && fail "a failed, skipped or todo test is present"
          for k in fail cancelled skipped todo; do
            grep -Eq "^# $k 0$" "$log" || fail "summary line '# $k 0' is missing or non-zero"
          done
          exit "$bad"
